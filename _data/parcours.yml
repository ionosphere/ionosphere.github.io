# ⚠️ CV-6 — RÉINTÉGRÉE (2026-07-16). Je l'avais écartée en écrivant qu'un stage
#    de vingt ans n'apportait rien : arbitrage utilisateur contraire.
#
# ⚠️ NOM — l'expérience a eu lieu chez **Charentes Alliance**. « Ocealia » n'existe
#    que depuis décembre 2015, née de la fusion Charentes Alliance + Coréa
#    Poitou-Charentes. Écrire « Ocealia · 2002-2004 » serait un anachronisme : il
#    n'a jamais travaillé chez Ocealia. D'où le nom d'époque + le successeur, qui
#    porte la reconnaissance d'aujourd'hui (le logo fourni est celui d'Ocealia).
#
# ⚠️ DATES — CONFLIT NON RÉSOLU. L'utilisateur dit 2002-2004 ; le CV DoYouBuzz dit
#    « juin 2004 à juin 2005 ». Deux ans d'écart, contenu identique (HACCP/sécurité
#    alimentaire + audit ATEX) : c'est le même stage. 2002-2004 retenu (parole de
#    l'intéressé, et cohérent avec l'IUP Génie des procédés 2002-2004, qu'il
#    chevauche exactement). À confirmer.
