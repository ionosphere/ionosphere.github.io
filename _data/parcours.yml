# Parcours — porte CV-7 (expériences PARALLÈLES).
#
# ⚠️ RÈGLE : `fin:` vide = poste en cours. Plusieurs entrées peuvent l'être
#    simultanément — c'est le cas ici (Ekylibre + bziiit). Aucun gabarit ne doit
#    supposer qu'il n'y a qu'un seul poste courant.
#
# ⚠️ RÈGLE : les chevauchements ne sont PAS des erreurs. Le gabarit dessine ce
#    qu'on lui donne. Aucun code ne « corrige » un chevauchement — c'est
#    exactement la faute que le CV DSI a commise en lissant le parcours.
#
# `nature` : clé fermée → couleur + code RPG.
#            entreprise | salariat | independant | agricole | stage
#
# `devenu` : nom actuel de l'organisation, si elle a changé depuis. On garde
#            TOUJOURS le nom d'époque en principal — écrire le nom actuel sur
#            des dates antérieures à son existence est un anachronisme (NFR-1).
#
# ⚠️⚠️ PIÈGE YAML — À CONNAÎTRE AVANT D'AJOUTER UN FAIT.
#    Une puce contenant « mot : mot » est lue comme un DICTIONNAIRE, pas comme
#    une phrase. La page affiche alors {"Élevage"=>"alimentation, soin"} en clair.
#    Ça n'échoue pas au build : ça s'imprime sur le site.
#
#        ❌  - Élevage : alimentation, soin, traite.
#        ✅  - 'Élevage : alimentation, soin, traite.'
#
#    Règle : tout fait contenant « deux-points entouré d'espaces » se met entre
#    guillemets simples (et les apostrophes internes se doublent).

