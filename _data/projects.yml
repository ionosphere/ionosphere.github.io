# Le book — PROJ-1, PROJ-5.
#
# PROJ-3 : ajouter un projet SANS page détail = ajouter un bloc ici. Rien d'autre.
# PROJ-4 : ajouter une étude de cas = créer _projects/<id>.md avec `ref: <id>`.
#          Le lien apparaît tout seul. Aucun gabarit à toucher.
#
# `statut` : actif | maintenu | archivé
# `stack` et `licence` sont des jetons LANG-4 → rendus en mono, jamais traduits.

- id: ekylibre
